<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zwigato · Artisanal Food Delivery &amp; Kitchen Partner Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,600&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF7F2;
  --surface: #FFFFFF;
  --surface-alt: #F3EDE2;
  --glass: rgba(255, 255, 255, 0.78);
  --glass-strong: rgba(255, 255, 255, 0.94);
  --ink: #18181B;
  --muted: #57534E;
  --border: #E6DFD3;
  --border-strong: #D4C9B8;
  --acc: #E04E2A;
  --acc-hover: #C93E1C;
  --acc-soft: rgba(224, 78, 42, 0.11);
  --acc-glow: rgba(224, 78, 42, 0.28);
  --saffron: #F59E0B;
  --saffron-soft: rgba(245, 158, 11, 0.15);
  --green: #16A34A;
  --green-soft: rgba(22, 163, 74, 0.13);
  --err: #DC2626;
  --err-soft: rgba(220, 38, 38, 0.12);
  --sh: 0 10px 30px rgba(24, 24, 27, 0.06);
  --sh-lg: 0 22px 54px rgba(24, 24, 27, 0.12);
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121110;
  --surface: #1C1A18;
  --surface-alt: #262320;
  --glass: rgba(28, 26, 24, 0.82);
  --glass-strong: rgba(28, 26, 24, 0.96);
  --ink: #F5F2EB;
  --muted: #A8A29E;
  --border: #302C28;
  --border-strong: #443E38;
  --acc: #F05D38;
  --acc-hover: #FF704D;
  --acc-soft: rgba(240, 93, 56, 0.16);
  --acc-glow: rgba(240, 93, 56, 0.34);
  --saffron: #FBBF24;
  --saffron-soft: rgba(251, 191, 36, 0.16);
  --green: #22C55E;
  --green-soft: rgba(34, 197, 94, 0.16);
  --err: #F87171;
  --err-soft: rgba(248, 113, 113, 0.16);
  --sh: 0 12px 34px rgba(0, 0, 0, 0.38);
  --sh-lg: 0 24px 60px rgba(0, 0, 0, 0.58);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: 86px; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 500 15px/1.55 var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background-color 0.28s ease, color 0.28s ease;
  background-image:
    radial-gradient(60vmax 50vmax at 6% 2%, rgba(224, 78, 42, 0.06), transparent 60%),
    radial-gradient(50vmax 45vmax at 94% 12%, rgba(245, 158, 11, 0.07), transparent 60%);
}

.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 20px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: var(--sh);
}

.glass-bar {
  background: var(--glass);
  border: 1px solid var(--border);
  box-shadow: var(--sh);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  backdrop-filter: blur(18px) saturate(160%);
}

/* =========================================================
   NETFLIX-STYLE CINEMATIC SPLASH INTRO ANIMATION
   ========================================================= */
.splash {
  position: fixed;
  inset: 0;
  z-index: 120;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 45%, rgba(224, 78, 42, 0.22) 0%, rgba(18, 8, 5, 0.92) 48%, #000000 100%);
  background-color: #000000;
  overflow: hidden;
  transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.55s ease;
}
.splash.zoom-out {
  animation: netflixPushThrough 0.72s cubic-bezier(0.65, 0, 0.35, 1) forwards;
}
.splash.out {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  display: none;
}
@keyframes netflixPushThrough {
  0% { transform: scale(1); opacity: 1; }
  65% { transform: scale(3.2); opacity: 0.75; }
  100% { transform: scale(6.5); opacity: 0; }
}
.splash-box {
  text-align: center;
  padding: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}
.nf-stage {
  position: relative;
  width: 124px;
  height: 136px;
  display: grid;
  place-items: center;
  filter: drop-shadow(0 18px 42px rgba(224, 78, 42, 0.55));
}
.nf-ribbon {
  width: 112px;
  height: 124px;
  overflow: visible;
}
.nf-bar-top {
  opacity: 0;
  transform-origin: left center;
  animation: ribbonSlideX 0.42s 0.08s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.nf-bar-diag {
  opacity: 0;
  transform-origin: center;
  animation: ribbonDiag 0.48s 0.34s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.nf-bar-bot {
  opacity: 0;
  transform-origin: left center;
  animation: ribbonSlideX 0.42s 0.62s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.nf-spark {
  opacity: 0;
  transform: scale(0);
  transform-origin: 92px 22px;
  animation: sparkPop 0.4s 0.88s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.nf-sheen {
  position: absolute;
  inset: -10px;
  background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.42) 50%, transparent 70%);
  transform: translateX(-140%);
  pointer-events: none;
  animation: sheenSweep 0.85s 0.92s ease-in-out forwards;
}
@keyframes ribbonSlideX {
  0% { opacity: 0; transform: scaleX(0.05); }
  100% { opacity: 1; transform: scaleX(1); }
}
@keyframes ribbonDiag {
  0% { opacity: 0; transform: scale(0.35); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes sparkPop {
  0% { opacity: 0; transform: scale(0); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes sheenSweep {
  0% { transform: translateX(-140%); }
  100% { transform: translateX(140%); }
}
.splash-title {
  font: 800 42px/1.05 var(--serif);
  color: #FAF7F2;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  margin: 22px 0 8px;
  opacity: 0;
  animation: wordmarkExpand 0.75s 0.82s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  text-shadow: 0 6px 28px rgba(224, 78, 42, 0.55);
}
@keyframes wordmarkExpand {
  0% { opacity: 0; letter-spacing: 0.42em; transform: translateY(10px) scale(0.94); }
  100% { opacity: 1; letter-spacing: 0.14em; transform: translateY(0) scale(1); }
}
.splash-sub {
  color: #A8A29E;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  opacity: 0;
  animation: fadeSub 0.5s 1.1s ease forwards;
}
@keyframes fadeSub { to { opacity: 1; } }
.skip-intro-btn {
  position: fixed;
  bottom: 26px;
  right: 26px;
  z-index: 125;
  padding: 9px 18px;
  border-radius: 99px;
  border: 1px solid rgba(255, 255, 255, 0.24);
  background: rgba(255, 255, 255, 0.09);
  color: #FAF7F2;
  font: 700 13px var(--sans);
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: background 0.2s ease, transform 0.15s ease;
}
.skip-intro-btn:hover {
  background: rgba(224, 78, 42, 0.85);
  border-color: #E04E2A;
  transform: translateY(-1px);
}

/* =========================================================
   TYPOGRAPHY & BUTTONS
   ========================================================= */
h1, h2, h3, .serif { font-family: var(--serif); letter-spacing: -0.025em; }
h2 { font-size: clamp(22px, 3vw, 28px); font-weight: 700; margin: 0; }

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--ink);
  font: 800 23px/1 var(--serif);
  cursor: pointer;
}
.brand svg { width: 34px; height: 34px; }
.badge-pill {
  font: 800 10px/1 var(--sans);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  padding: 4px 9px;
  border-radius: 99px;
  background: var(--acc-soft);
  color: var(--acc);
}

.btn {
  font: 700 13.5px/1 var(--sans);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink);
  border-radius: 99px;
  padding: 10px 16px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: transform 0.15s ease, background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--acc); }
.btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary {
  background: var(--acc);
  border-color: var(--acc);
  color: #FFF;
  box-shadow: 0 6px 18px var(--acc-glow);
}
.btn.primary:hover:not(:disabled) { background: var(--acc-hover); border-color: var(--acc-hover); }
.btn.green {
  background: var(--green);
  border-color: var(--green);
  color: #FFF;
}
.btn.saffron {
  background: var(--saffron-soft);
  border-color: rgba(245, 158, 11, 0.4);
  color: var(--ink);
}
.btn.ai {
  background: linear-gradient(135deg, #18181B, #3F3F46);
  border-color: #18181B;
  color: #FAF7F2;
  box-shadow: 0 8px 20px rgba(24, 24, 27, 0.22);
}
:root[data-theme="dark"] .btn.ai {
  background: linear-gradient(135deg, #E04E2A, #D97706);
  border-color: transparent;
  color: #FFF;
}
.btn.sm { padding: 7px 13px; font-size: 12.5px; }
.btn.xs { padding: 5px 10px; font-size: 11.5px; }
.btn.wide { width: 100%; padding: 13px 18px; font-size: 14.5px; }
.btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* =========================================================
   TOP NAVIGATION BAR
   ========================================================= */
nav.topbar {
  position: sticky;
  top: 12px;
  z-index: 40;
  max-width: 1140px;
  margin: 14px auto 0;
  padding: 10px 14px 10px 20px;
  border-radius: 99px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.nav-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.user-chip {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  padding: 0 6px;
}

/* =========================================================
   AUTHENTICATION SCREEN
   ========================================================= */
.auth-screen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 28px 16px;
  position: relative;
}
.auth-tools {
  position: absolute;
  top: 18px;
  right: 20px;
  display: flex;
  gap: 8px;
}
.auth-card {
  width: min(490px, 100%);
  padding: 32px 30px;
}
.auth-card h1 {
  font-size: 30px;
  margin: 16px 0 4px;
}
.auth-sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

.role-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}
.role-opt {
  padding: 13px 14px;
  border-radius: 16px;
  border: 1.5px solid var(--border);
  background: var(--surface-alt);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: all 0.18s ease;
}
.role-opt.on {
  border-color: var(--acc);
  background: var(--acc-soft);
}
.role-opt strong { display: block; font-size: 14px; font-weight: 800; margin-top: 4px; }
.role-opt span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }

.field { margin-bottom: 13px; }
.field label {
  display: block;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 5px;
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 11px 14px;
  border-radius: 13px;
  border: 1px solid var(--border-strong);
  background: var(--bg);
  color: var(--ink);
  font: 600 14px var(--sans);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--acc);
  box-shadow: 0 0 0 3px var(--acc-soft);
}
.auth-err {
  min-height: 20px;
  color: var(--err);
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 10px;
}
.demo-box {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px dashed var(--border-strong);
}
.demo-box p { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.05em; }
.demo-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* =========================================================
   LIVE ORDER TRACKER BANNER (CUSTOMER VIEW)
   ========================================================= */
.tracker-banner {
  margin: 22px 0 6px;
  padding: 22px 24px;
  border: 1.5px solid var(--acc);
  background: linear-gradient(135deg, var(--surface), var(--surface-alt));
  position: relative;
  overflow: hidden;
}
.tracker-top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.live-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  border-radius: 99px;
  background: var(--green-soft);
  color: var(--green);
  font-size: 12px;
  font-weight: 800;
}
.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  animation: pulseDot 1.6s infinite;
}
@keyframes pulseDot {
  0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.5); }
  70% { box-shadow: 0 0 0 8px rgba(22, 163, 74, 0); }
  100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
}

.tracker-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 20px;
  align-items: center;
}
@media (max-width: 840px) {
  .tracker-grid { grid-template-columns: 1fr; }
}

.stepper {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 14px 0;
}
.step-node {
  padding: 10px 8px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--bg);
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  transition: all 0.25s ease;
}
.step-node.done {
  border-color: var(--green);
  background: var(--green-soft);
  color: var(--green);
}
.step-node.curr {
  border-color: var(--acc);
  background: var(--acc-soft);
  color: var(--acc);
  box-shadow: 0 4px 14px var(--acc-glow);
}
.step-node span { display: block; font-size: 18px; margin-bottom: 3px; }

.route-map {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 14px 16px;
}
.rider-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--border-strong);
  font-size: 13px;
}

/* =========================================================
   CUSTOMER HERO & TRIE SEARCH
   ========================================================= */
.hero { padding: 34px 0 14px; }
.hero-kicker {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.editorial-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 99px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
}
.flash-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 99px;
  background: var(--saffron-soft);
  border: 1px solid rgba(245, 158, 11, 0.35);
  font-size: 12.5px;
  font-weight: 800;
  color: var(--ink);
}
.flash-pill code { font-family: var(--mono); color: var(--acc); }

.hero h1 {
  font-size: clamp(36px, 5.6vw, 60px);
  line-height: 1.04;
  font-weight: 800;
  margin: 0 0 12px;
}
.hero h1 em {
  font-style: italic;
  color: var(--acc);
  font-weight: 700;
}
.hero p.sub {
  color: var(--muted);
  font-size: 16px;
  max-width: 58ch;
  margin: 0 0 22px;
}

.search-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  max-width: 760px;
}
.search-box {
  flex: 1;
  min-width: 260px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px 6px 18px;
  border-radius: 99px;
  background: var(--surface);
  border: 1.5px solid var(--border-strong);
  box-shadow: var(--sh);
}
.search-box:focus-within {
  border-color: var(--acc);
  box-shadow: 0 0 0 4px var(--acc-soft);
}
.search-box input {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--ink);
  font: 600 15px var(--sans);
  padding: 9px 0;
  outline: none;
}

.trie-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-top: 12px;
  min-height: 32px;
  font-size: 12.5px;
  color: var(--muted);
}
.t-node {
  padding: 3px 10px;
  border-radius: 99px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-weight: 800;
  color: var(--ink);
}
.t-node small { color: var(--acc); font-family: var(--mono); margin-left: 4px; }
.t-next {
  padding: 4px 10px;
  border-radius: 99px;
  border: 1px dashed var(--border-strong);
  background: var(--surface-alt);
  color: var(--ink);
  font: 700 11.5px var(--mono);
  text-transform: uppercase;
  cursor: pointer;
}
.t-next:hover { background: var(--acc); color: #FFF; border-style: solid; border-color: var(--acc); }

/* =========================================================
   FARTHER GEMS & FLASH DROPS SLIDER
   ========================================================= */
.sec-bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 34px 0 16px;
}
.carousel {
  display: flex;
  gap: 18px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding: 4px 2px 14px;
  scrollbar-width: none;
}
.carousel::-webkit-scrollbar { display: none; }
.gem-card {
  flex: 0 0 min(335px, 85vw);
  scroll-snap-align: start;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: transform 0.22s ease, border-color 0.22s ease;
}
.gem-card:hover { transform: translateY(-4px); border-color: var(--acc); }
.gem-media { position: relative; height: 150px; background: var(--surface-alt); overflow: hidden; }
.gem-media img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
.gem-card:hover .gem-media img { transform: scale(1.05); }
.tag-dist {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 4px 10px;
  border-radius: 99px;
  background: rgba(24, 24, 27, 0.8);
  color: #FAF7F2;
  font-size: 11px;
  font-weight: 700;
}
.tag-flash {
  position: absolute;
  bottom: 10px;
  right: 10px;
  padding: 4px 10px;
  border-radius: 99px;
  background: var(--acc);
  color: #FFF;
  font-size: 11px;
  font-weight: 800;
}
.gem-content { padding: 15px 18px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }

/* =========================================================
   FILTERS & RESTAURANT MARKETPLACE GRID
   ========================================================= */
.filters-wrap { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.filter-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.f-lbl { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-right: 4px; }
.chip-btn {
  padding: 6px 14px;
  border-radius: 99px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--muted);
  font: 700 12.5px var(--sans);
  cursor: pointer;
  transition: all 0.16s ease;
}
.chip-btn:hover { color: var(--ink); border-color: var(--acc); }
.chip-btn.on { background: var(--acc); border-color: var(--acc); color: #FFF; }
.chip-btn.diet.on { background: var(--green); border-color: var(--green); color: #FFF; }

.rest-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}
.rest-card {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;

  try {
    return window.localStorage.getItem(key);

    return memoryStore.has(key) ? memoryStore.get(key) : null;
  }
}

function safeStorageSet(key, value) {
  memoryStore.set(key, value);
  try {
    window.localStorage.setItem(key, value);
  } catch (e) {
    // Sandboxed iframe fallback: keep in memoryStore without throwing
  }
}

function safeStorageRemove(key) {
  memoryStore.delete(key);
  try {
    window.localStorage.removeItem(key);
  } catch (e) {}
}

function cloneData(obj) {
  if (typeof structuredClone === "function") {

}

// =========================================================
// 2. TRIE PREFIX SEARCH ENGINE
// =========================================================
class TrieNode {
  constructor() { this.children = {}; this.refs = new Set(); }
}
class PrefixTrie {
  constructor() { this.root = new TrieNode(); }
  insert(phrase, ref) {
    for (const word of phrase.toLowerCase().split(/\s+/)) {
      let cur = this.root;
      for (const ch of word) {
        cur = cur.children[ch] ??= new TrieNode();
        cur.refs.add(ref);
      }
    }
  }
  search(query) {
    let result = null;
    const words = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
    for (const w of words) {
      let cur = this.root;
      for (const ch of w) {
        cur = cur?.children[ch];
      }
      const set = cur ? cur.refs : new Set();
      result = result ? new Set([...result].filter(x => set.has(x))) : new Set(set);
    }
    return result || new Set();
  }
  trace(word) {
    const steps = [];
    let cur = this.root;
    for (const ch of word) {
      cur = cur?.children[ch];
      if (!cur) {
        steps.push({ch, count: 0});
        return {steps, next: [], dead: true};
      }
      steps.push({ch, count: cur.refs.size});
    }
    return {steps, next: Object.keys(cur.children).sort(), dead: false};
  }
}

let trie = new PrefixTrie();
function rebuildTrie() {
  trie = new PrefixTrie();
  db.restaurants.forEach(r => {
    trie.insert(r.name, `r:${r.id}`);
    trie.insert(r.cuisine, `r:${r.id}`);
    r.menu.forEach(m => {
      trie.insert(m.name, `m:${r.id}:${m.id}`);
      trie.insert(m.diet, `m:${r.id}:${m.id}`);
    });
  });
}

function playTaDumChime() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    if (ctx.state === "suspended") {
      ctx.resume().catch(() => {});
    }
    const now = ctx.currentTime;

    // First low percussive thud ("Ta-")
    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();
    osc1.type = "triangle";
    osc1.frequency.setValueAtTime(110, now);
    osc1.frequency.exponentialRampToValueAtTime(52, now + 0.22);
    gain1.gain.setValueAtTime(0.001, now);
    gain1.gain.linearRampToValueAtTime(0.24, now + 0.02);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    osc1.connect(gain1);
    gain1.connect(ctx.destination);
    osc1.start(now);
    osc1.stop(now + 0.3);

    // Second resonant fifth chord ("-DUM")
    [73.42, 110.0, 146.83].forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = idx === 0 ? "sine" : "triangle";
      osc.frequency.setValueAtTime(freq, now + 0.26);
      gain.gain.setValueAtTime(0.001, now + 0.26);
      gain.gain.linearRampToValueAtTime(idx === 0 ? 0.26 : 0.11, now + 0.31);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.55);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + 0.26);
      osc.stop(now + 1.6);
    });
  } catch (e) {
    // Never block splash lifecycle if Web Audio is restricted
  }
}

function addToCart(restId, itemId, delta = 1) {
  const rest = db.restaurants.find(r => r.id === restId);
  const dish = rest?.menu.find(m => m.id === itemId);
  if (!rest || !dish || !dish.inStock) return;

  if (cart.restaurantId && cart.restaurantId !== restId && cart.items.length > 0) {
    toast(`Cart cleared from previous kitchen & started with ${rest.name}`);
    cart = {restaurantId: restId, items: []};
    checkoutState.promoCode = "";
    checkoutState.promoDiscount = 0;
    checkoutState.freeDelivery = false;
  }
  cart.restaurantId = restId;

  const existing = cart.items.find(i => i.itemId === itemId);
  if (existing) {
    existing.qty += delta;
    if (existing.qty <= 0) {
      cart.items = cart.items.filter(i => i.itemId !== itemId);
    }
  } else if (delta > 0) {
    cart.items.push({itemId, qty: delta});
  }

  if (cart.items.length === 0) cart.restaurantId = null;
  if (delta > 0) toast(`Added ${dish.name} (${inr(getEffectivePrice(dish))})`);
  renderAll();
}

function getCartSummary() {
  if (!cart.restaurantId || cart.items.length === 0) return null;
  const rest = db.restaurants.find(r => r.id === cart.restaurantId);
  if (!rest) return null;

  let count = 0;
  let subtotal = 0;
  let flashSaved = 0;
  const lines = [];

  cart.items.forEach(ci => {
    const dish = rest.menu.find(m => m.id === ci.itemId);
    if (!dish) return;
    const unitPrice = getEffectivePrice(dish);
    count += ci.qty;
    subtotal += unitPrice * ci.qty;
    flashSaved += (dish.price - unitPrice) * ci.qty;
    lines.push({...dish, unitPrice, qty: ci.qty, lineTotal: unitPrice * ci.qty});
  });

  let promoDiscount = 0;
  let freeDel = false;
  const code = checkoutState.promoCode.trim().toUpperCase();
  if (code === "ZWIGATO50" && subtotal >= 149) promoDiscount = 50;
  else if (code === "FIRST20") promoDiscount = Math.min(100, Math.round(subtotal * 0.2));
  else if (code === "FREEDEL") freeDel = true;

  const deliveryFee = freeDel ? 0 : (rest.isFar ? 35 : 20);
  const taxes = Math.round((subtotal - promoDiscount) * 0.05);
  const total = Math.max(0, subtotal - promoDiscount + deliveryFee + taxes + checkoutState.tip);

  return {rest, count, lines, subtotal, flashSaved, promoDiscount, freeDel, deliveryFee, taxes, tip: checkoutState.tip, total};
}

function applyPromo(codeInput) {
  const code = codeInput.trim().toUpperCase();
  const sum = getCartSummary();
  if (!sum) return;
  if (code === "ZWIGATO50") {
    if (sum.subtotal < 149) {
      toast("ZWIGATO50 requires minimum order of ₹149");
      return;
    }
    checkoutState.promoCode = code;
    toast("Applied ZWIGATO50: ₹50 OFF!");
  } else if (code === "FIRST20") {
    checkoutState.promoCode = code;
    toast("Applied FIRST20: 20% OFF!");
  } else if (code === "FREEDEL") {
    checkoutState.promoCode = code;
    toast("Applied FREEDEL: ₹0 Delivery Fee!");
  } else {
    toast("Invalid code. Try ZWIGATO50, FIRST20, or FREEDEL");
    return;
  }
  renderDrawer();
}

function advanceOrderStage(orderId) {
  const ord = db.orders.find(o => o.id === orderId);
  if (!ord) return;
  const flow = ["PENDING", "PREPARING", "OUT_FOR_DELIVERY", "DELIVERED"];
  const idx = flow.indexOf(ord.status);
  if (idx >= 0 && idx < flow.length - 1) {
    ord.status = flow[idx + 1];
    saveDB();
    toast(`Order ${ord.id} is now ${ord.status.replaceAll("_", " ")}`);
    renderAll();
  }
}

function startLiveOrderSimulation(orderId) {
  if (autoProgressionTimer) clearInterval(autoProgressionTimer);
  autoProgressionTimer = setInterval(() => {
    const ord = db.orders.find(o => o.id === orderId);
    if (!ord || ord.status === "DELIVERED" || ord.status === "CANCELLED") {
      clearInterval(autoProgressionTimer);
      return;
    }
    advanceOrderStage(orderId);
  }, 9000);
}

// 7. LIVE GEMINI AI CONCIERGE (WITH DETERMINISTIC FALLBACK)
// =========================================================
const DEFAULT_GEMINI_KEY = ""; // Runtime-injected key or custom user key in drawer

function buildCatalogContext() {
  return db.restaurants.map(r => {
    const dishes = r.menu.filter(m => m.inStock).map(m =>
      `[ID:${r.id}:${m.id}] ${m.name} (₹${getEffectivePrice(m)}, ${m.diet}${m.isFlash ? ", FLASH -25%" : ""})`
    ).join("; ");
    return `${r.name} (ETA ${r.etaMins}m, ★${r.rating}): ${dishes}`;
  }).join("\n");
}

function fallbackAiEngine(prompt) {
  const q = prompt.toLowerCase();
  const allItems = [];
  db.restaurants.forEach(r => r.menu.filter(m => m.inStock).forEach(m => {
    allItems.push({...m, restId: r.id, restName: r.name, etaMins: r.etaMins});
  }));

  if (q.includes("fast") || q.includes("quick") || q.includes("speed") || q.includes("eta")) {
    const fast = [...allItems].sort((a, b) => a.etaMins - b.etaMins).slice(0, 3);
    return {
      text: "Here are the fastest kitchens dispatching right now (under 16 mins):",
      recs: fast
    };
  }
  if (q.includes("stress") || q.includes("comfort") || q.includes("sad")) {
    const comfort = allItems.filter(i => /dal|chocolate|momo|samosa|dosa/i.test(i.name)).slice(0, 3);
    return {
      text: "Take a breather — warm, comforting bowls & treats to lift your mood:",
      recs: comfort
    };
  }
  if (q.includes("rain") || q.includes("chai") || q.includes("evening")) {
    const rainy = allItems.filter(i => /samosa|momo|coffee|chocolate/i.test(i.name)).slice(0, 3);
    return {
      text: "Rainy evening perfection — hot chai, crispy samosas & steaming dumplings:",
      recs: rainy
    };
  }
  if (q.includes("workout") || q.includes("protein") || q.includes("energ")) {
    const prot = allItems.filter(i => /paneer|kebab|sushi|idli|dal/i.test(i.name)).slice(0, 3);
    return {
      text: "High-protein, clean-energy picks to refuel after your session:",
      recs: prot
    };
  }
  const specials = allItems.filter(i => i.isFlash || i.isSpecial).slice(0, 3);
  return {
    text: "Top chef specials and active -25% flash deals tailored for your craving:",
    recs: specials
  };
}

async function askZwigatoAI(userPrompt) {
  const text = userPrompt.trim();
  if (!text) return;

  const feed = $("#aiFeed");
  feed.insertAdjacentHTML("beforeend", `<div class="bubble usr">${esc(text)}</div>`);
  const loadId = "ai_load_" + Date.now();
  feed.insertAdjacentHTML("beforeend", `<div class="bubble bot" id="${loadId}">Curating dishes from live kitchens… ✨</div>`);
  feed.scrollTop = feed.scrollHeight;

  const customKey = $("#geminiKeyInput").value.trim();
  const apiKey = customKey || DEFAULT_GEMINI_KEY;
  const local = fallbackAiEngine(text);
  let replyText = local.text;
  let recommendedDishes = local.recs;

  if (apiKey) {
    try {
      const sysPrompt = `You are Zwigato AI, an artisanal food delivery concierge. Recommend 2-3 dishes from this LIVE menu catalog based on the user's mood or request for fastest delivery. For every dish you recommend, include its exact tag [ADD:restId:itemId] in your response.\n\nLIVE CATALOG:\n${buildCatalogContext()}`;
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          systemInstruction: {parts: [{text: sysPrompt}]},
          contents: [{parts: [{text}]}]
        })
      });
      const data = await res.json();
      const rawReply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (rawReply) {
        const parsedRecs = [];
        const cleanText = rawReply.replace(/\[ADD:(\d+):(\d+)\]/g, (_, rId, iId) => {
          const r = db.restaurants.find(x => x.id === Number(rId));
          const m = r?.menu.find(x => x.id === Number(iId));
          if (r && m) parsedRecs.push({...m, restId: r.id, restName: r.name, etaMins: r.etaMins});
          return "";
        }).trim();
        replyText = cleanText;
        if (parsedRecs.length > 0) recommendedDishes = parsedRecs;
      }
    } catch (err) {
      // Seamless fallback to deterministic catalog engine
    }
  }

  const cardsHtml = recommendedDishes.map(d => `
    <div class="ai-dish-rec">
      <div>
        <strong style="font-size:13px">${esc(d.name)} · ${inr(getEffectivePrice(d))}</strong>
        <div style="font-size:11.5px;color:var(--muted)">${esc(d.restName)} · ⏱ ${d.etaMins}m · ${esc(d.diet)}</div>
      </div>
      <button type="button" class="btn primary xs" onclick="addToCart(${d.restId}, ${d.id}, 1)">+ Add</button>
    </div>
  `).join("");

  const target = document.getElementById(loadId);
  if (target) {
    target.innerHTML = `${esc(replyText).replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")}${cardsHtml}`;
  }
  feed.scrollTop = feed.scrollHeight;
}

function renderCustomerMarketplace() {
  renderLiveTracker();

  // Trie Visualizer
  const lastWord = searchQuery.toLowerCase().trim().split(/\s+/).pop() || "";
  const trace = trie.trace(lastWord);
  let trieHtml = trace.steps.map(s => `<span class="t-node">${esc(s.ch)}<small>${s.count}</small></span>`).join("");
  const suggestions = lastWord ? trace.next : Object.keys(trie.root.children).sort();
  if (trace.dead) {
    trieHtml += `<span>No prefix match for “${esc(lastWord)}”</span>`;
  } else if (suggestions.length) {
    trieHtml += `<span>${lastWord ? "Next characters:" : "Trie index keys:"}</span>` +
      suggestions.slice(0, 12).map(ch => `<button type="button" class="t-next" data-ch="${ch}">${ch}</button>`).join("");
  }
  $("#trieVisualizer").innerHTML = trieHtml;
  $("#clearSearchBtn").hidden = !searchQuery.length;

  // Farther Gems Carousel

function renderPartnerConsole() {
  const rest = db.restaurants.find(r => r.id === managedRestId) || db.restaurants[0];
  if (!rest) return;

  const restOrders = db.orders.filter(o => o.restaurantId === rest.id);
  const allValidOrders = db.orders.filter(o => o.status !== "CANCELLED");

  const activeOrders = db.orders.filter(o => o.status === "PENDING" || o.status === "PREPARING" || o.status === "OUT_FOR_DELIVERY");

  $("#partnerKpis").innerHTML = `

  $("#partnerKdsGrid").innerHTML = cols.map(col => {

              <span class="badge-pill">${esc(o.paymentMethod)}</span>
            </div>
            <div style="font-size:12px;color:var(--muted);margin:3px 0 8px">${esc(o.restaurantName)} · ${esc(o.address)}</div>

      </div>
    `;

  // Menu & Pricing Manager List
  $("#partnerMenuItems").innerHTML = rest.menu.map(m => `
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--border);margin-bottom:8px">

        <div class="bar-item">
          <div class="bar-top"><span>${esc(n)}</span><span>${c} sold</span></div>
          <div class="bar-bg"><div class="bar-val" style="width:${Math.round(c / topVal * 100)}%"></div></div>
        </div>
      `).join("")
    : `<div style="color:var(--muted);font-size:13px">Place an order in Customer mode to see live dish demand!</div>`;

  const totalPays = Object.values(payCounts).reduce((a, b) => a + b, 0) || 1;
  $("#analyticsPayments").innerHTML = Object.entries(payCounts).map(([pm, cnt]) => {
    const pct = Math.round((cnt / totalPays) * 100);
    return `
      <div class="bar-item">
        <div class="bar-top"><span>${pm}</span><span>${pct}% (${cnt})</span></div>
        <div class="bar-bg"><div class="bar-val" style="width:${pct}%;background:var(--green)"></div></div>
      </div>
    `;
  }).join("");
}

function renderAll() {
  if (!db.session) return;
  renderCustomerMarketplace();
  renderDrawer();
  if (activeViewRole === "partner") renderPartnerConsole();
}

// =========================================================
// 9. EVENT WIRING
// =========================================================
window.openRestaurant = id => {
  selectedRestId = id;
  renderCustomerMarketplace();
  if (id !== null) window.scrollTo({top: $("#catalogHeading").offsetTop - 90, behavior: "smooth"});
};
window.setCuisineFilter = c => { filterCuisine = c; selectedRestId = null; renderCustomerMarketplace(); };
window.setDietFilter = d => { filterDiet = d; selectedRestId = null; renderCustomerMarketplace(); };
window.addToCart = addToCart;
window.applyPromo = applyPromo;
window.confirmCheckoutOrder = confirmCheckoutOrder;
window.advanceOrderStage = advanceOrderStage;
window.renderDrawer = renderDrawer;

window.setOrderStatus = (orderId, newStatus) => {
  const ord = db.orders.find(o => o.id === orderId);
  if (!ord) return;
  ord.status = newStatus;
  saveDB();
  toast(`Order ${orderId} updated to ${newStatus.replaceAll("_", " ")}`);
  renderAll();
};

window.toggleMenuProp = (restId, itemId, prop) => {
  const rest = db.restaurants.find(r => r.id === restId);
  const item = rest?.menu.find(m => m.id === itemId);
  if (!item) return;
  item[prop] = !item[prop];
  saveDB();
  toast(`Updated "${item.name}"`);
  renderAll();
};

$("#partnerRestSelect").onchange = e => {
  managedRestId = Number(e.target.value);
  renderPartnerConsole();
};

$("#partnerAddDishForm").onsubmit = e => {
  e.preventDefault();
  const rest = db.restaurants.find(r => r.id === managedRestId);
  if (!rest) return;
  const name = $("#ndName").value.trim();
  const price = Number($("#ndPrice").value);
  const diet = $("#ndDiet").value;
  const preset = $("#ndImgPreset").value;
  const desc = $("#ndDesc").value.trim() || "Freshly crafted in our partner kitchen";
  const isFlash = $("#ndFlash").checked;

  const newItem = {
    id: Date.now(),
    name,
    price,
    desc,
    diet,
    img: PHOTOS[preset] || rest.banner,
    inStock: true,
    isFlash,
    isSpecial: true
  };
  rest.menu.unshift(newItem);
  saveDB();
  rebuildTrie();
  e.target.reset();
  toast(`Published "${name}" to ${rest.name}!`);
  renderAll();
};

$("#navHome").onclick = () => {
  selectedRestId = null;
  filterCuisine = "All";
  filterDiet = "All";
  searchQuery = "";
  $("#searchInput").value = "";
  renderAll();
  window.scrollTo({top: 0, behavior: "smooth"});
};

$("#searchInput").oninput = e => {
  searchQuery = e.target.value;
  selectedRestId = null;
  renderCustomerMarketplace();
};

$("#clearSearchBtn").onclick = () => {
  searchQuery = "";
  $("#searchInput").value = "";
  renderCustomerMarketplace();
};

$("#trieVisualizer").onclick = e => {
  const btn = e.target.closest("button[data-ch]");
  if (!btn) return;
  const inp = $("#searchInput");
  inp.value += btn.dataset.ch;
  inp.dispatchEvent(new Event("input"));
  inp.focus();
};

$("#prevSlideBtn").onclick = () => $("#gemsCarousel").scrollBy({left: -340, behavior: "smooth"});
$("#nextSlideBtn").onclick = () => $("#gemsCarousel").scrollBy({left: 340, behavior: "smooth"});

function openDrawer() {
  $("#drawerBackdrop").classList.add("on");
  $("#checkoutDrawer").classList.add("on");
  $("#checkoutDrawer").setAttribute("aria-hidden", "false");
  renderDrawer();
}
function closeDrawer() {
  $("#drawerBackdrop").classList.remove("on");
  $("#checkoutDrawer").classList.remove("on");
  $("#checkoutDrawer").setAttribute("aria-hidden", "true");
}
$("#openCartBtn").onclick = openDrawer;
$("#closeDrawerBtn").onclick = closeDrawer;
$("#drawerBackdrop").onclick = closeDrawer;

// AI Concierge Controls
function setAiOpen(open) {
  $("#aiBox").classList.toggle("on", open);
  if (open) $("#aiPromptInput").focus();
}
$("#aiFabBtn").onclick = () => setAiOpen(!$("#aiBox").classList.contains("on"));
$("#heroAiBtn").onclick = () => setAiOpen(true);
$("#aiCloseBtn").onclick = () => setAiOpen(false);
$("#saveKeyBtn").onclick = () => {
  toast("Gemini API key saved for this session");
};
document.querySelectorAll(".mood-pill").forEach(p => {
  p.onclick = () => askZwigatoAI(p.dataset.q);
});
$("#aiChatForm").onsubmit = e => {
  e.preventDefault();
  const inp = $("#aiPromptInput");
  const val = inp.value;
  inp.value = "";
  askZwigatoAI(val);
};

// Cross-tab Live LocalStorage Sync
window.addEventListener("storage", e => {
  if (e.key === DB_KEY) {
    db = loadDB();
    rebuildTrie();
    renderAll();
  }
});

// Restore active session on page reload
if (db.session) {
  launchSession(db.session);
}
</script>
</body>
</html>
